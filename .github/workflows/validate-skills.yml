name: Validate skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Regenerate skill index
        run: python scripts/generate_skill_index.py
      - name: Fail when generated catalog artifacts are stale
        run: git diff --exit-code -- docs/SKILL_INDEX.md docs/SKILL_ALIASES.json
      - name: Validate skill structure and public paths
        run: python scripts/validate_skills.py
      - name: Check defensive security quality bar
        run: python scripts/check_security_quality.py
      - name: Smoke-test portable starter-pack export
        run: python scripts/export_skills.py --pack web-app-team --destination "$RUNNER_TEMP/open-skillbox-export"
      - name: Check whitespace errors
        run: git diff --check
